apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-python3-image
  annotations:
    x-gitter-enabled: "true"
spec:
  params:
    - name: image_tag
      type: string
    - name: org_id
      type: string
  tasks:
    - name: build-push-python3
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "python3"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "jobs/python3.Dockerfile"
        - name: build_context
          value: "jobs"
        - name: org_id
          value: "$(params.org_id)"
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-images-pipeline
  annotations:
    x-gitter-enabled: "true"
spec:
  params:
    - name: image_tag
      type: string
    - name: org_id
      type: string
  tasks:
    # ─────────────── pipeline-images/rust-rocket-api ───────────────
    - name: build-push-rust-rocket-builder
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "rust-rocket-api-builder"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "pipeline-images/rust-rocket-api/Dockerfile.builder"
        - name: build_context
          value: "pipeline-images/rust-rocket-api"
        - name: org_id
          value: "$(params.org_id)"

    - name: build-push-rust-rocket-runner
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "rust-rocket-api-runner"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "pipeline-images/rust-rocket-api/Dockerfile.runner"
        - name: build_context
          value: "pipeline-images/rust-rocket-api"
        - name: org_id
          value: "$(params.org_id)"

    - name: build-push-vite-react-builder
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "vite-react-builder"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "pipeline-images/vite-react/Dockerfile.builder"
        - name: build_context
          value: "pipeline-images/vite-react"
        - name: org_id
          value: "$(params.org_id)"

    # ─────────────────────── devcontainer-images ───────────────────────
    - name: build-push-devcontainer-node
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "dev-container-node"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "devcontainer-images/Dockerfile.node.debian"
        - name: build_context
          value: "devcontainer-images"
        - name: org_id
          value: "$(params.org_id)"

    - name: build-push-devcontainer-rust
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "dev-container-rust"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "devcontainer-images/Dockerfile.rust.bullseye"
        - name: build_context
          value: "devcontainer-images"
        - name: org_id
          value: "$(params.org_id)"

    - name: build-push-devcontainer-iac
      runAfter:
        - clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: build-and-push-dockerfile-image
          - name: namespace
            value: default
      params:
        - name: image_repo
          value: "dev-iac"
        - name: image_tag
          value: "latest"
        - name: dockerfile_path
          value: "devcontainer-images/Dockerfile.iac.debian"
        - name: build_context
          value: "devcontainer-images"
        - name: org_id
          value: "$(params.org_id)"

    # ─────────────────────────── wrap-up ───────────────────────────
    - name: notify-version-update
      runAfter:
        - build-push-rust-rocket-builder
        - build-push-rust-rocket-runner
        - build-push-vite-react-builder
        - build-push-devcontainer-node
        - build-push-devcontainer-rust
        - build-push-devcontainer-iac
      taskSpec:
        steps:
          - name: echo
            image: alpine
            script: |
              #!/bin/sh
              echo "Hello World - all image builds are done!"
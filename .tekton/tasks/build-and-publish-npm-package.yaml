apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-and-publish-npm-package
  namespace: default
spec:
  params:
    - name: build_command
      type: string
      default: "pnpm build"
  steps:
    - name: build-and-publish
      image: docker.io/gingersociety/vite-react-builder:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        export HUSKY=0

        # ── restore npm credentials staged by ginger-connector-setup ───────
        # That step runs `ginger-auth token-login` in its own container and
        # copies the resulting ~/.npmrc into the shared /workspace/creds
        # workspace, since this step's $HOME starts empty.
        if [ ! -f /workspace/creds/.npmrc ]; then
          echo "No .npmrc found in /workspace/creds — did ginger-auth run first?"
          exit 1
        fi
        cp /workspace/creds/.npmrc "$HOME/.npmrc"
        chmod 600 "$HOME/.npmrc"

        cd /workspace/source/repo

        cd /workspace/source/repo

        echo "=== DEBUG: HEAD commit (no git binary needed) ==="
        cat .git/HEAD 2>&1
        # if it prints "ref: refs/heads/main", follow it:
        cat .git/refs/heads/main 2>&1 || echo "no local ref file — might be packed-refs"
        grep 'refs/heads/main' .git/packed-refs 2>&1

        echo "=== DEBUG: is icons/ on disk after checkout? ==="
        ls -la src/icons/ 2>&1 || echo "MISSING ON DISK"

        export PNPM_HOME=/workspace/general-purpose-cache/pnpm
        mkdir -p "$PNPM_HOME"
        pnpm config set store-dir "$PNPM_HOME"

        echo "Installing dependencies..."
        pnpm i

        echo "Building..."
        $(params.build_command)

        echo "Publishing $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")..."
        pnpm publish --no-git-checks
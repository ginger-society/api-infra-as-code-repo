apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-and-publish-npm-package
  namespace: default
spec:
  params:
    - name: package_dir
      type: string
      default: "."
    - name: build_command
      type: string
      default: "pnpm build"
    - name: publish_tag
      type: string
      default: "latest"
    - name: publish_access
      type: string
      default: "public"
  steps:
    - name: build-and-publish
      image: docker.io/gingersociety/vite-react-builder:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        # ── restore npm credentials staged by ginger-connector-setup ───────
        # That step runs `ginger-auth token-login` in its own container and
        # copies the resulting ~/.npmrc into the shared /workspace/creds
        # workspace, since this step's $HOME starts empty.
        if [ ! -f /workspace/creds/.npmrc ]; then
          echo "No .npmrc found in /workspace/creds — did ginger-connector-setup run first?"
          exit 1
        fi
        cp /workspace/creds/.npmrc "$HOME/.npmrc"
        chmod 600 "$HOME/.npmrc"

        export PNPM_HOME=/workspace/general-purpose-cache/pnpm
        mkdir -p "$PNPM_HOME"
        pnpm config set store-dir "$PNPM_HOME"

        cd /workspace/source/repo

        PACKAGE_DIR="$(params.package_dir)"
        cd "$PACKAGE_DIR" 2>/dev/null || { echo "package_dir '$PACKAGE_DIR' not found under repo root"; exit 1; }

        echo "Installing dependencies..."
        pnpm i

        echo "Building..."
        $(params.build_command)

        echo "Publishing $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")..."
        pnpm publish \
          --tag "$(params.publish_tag)" \
          --access "$(params.publish_access)" \
          --no-git-checks
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-vite-spa
  namespace: default
spec:
  steps:
    - name: build
      image: docker.io/gingersociety/vite-react-builder:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        cd /workspace/source/repo

        export PNPM_HOME=/workspace/general-purpose-cache/pnpm
        mkdir -p "$PNPM_HOME"
        pnpm config set store-dir "$PNPM_HOME"

        # ── persist node_modules across builds, keyed by repo ──────────────
        # Restoring a previously-built node_modules avoids pnpm having to
        # copy every package out of the store on every run — it only has to
        # do that once. On subsequent runs pnpm just verifies against the
        # lockfile and (if unchanged) does almost nothing.
        REPO_KEY=$(basename "$(git rev-parse --show-toplevel)")
        NM_CACHE="/workspace/general-purpose-cache/node_modules-cache/${REPO_KEY}"
        mkdir -p "$NM_CACHE"

        if [ -d "$NM_CACHE/node_modules" ]; then
          echo "Restoring cached node_modules..."
          cp -a "$NM_CACHE/node_modules" ./node_modules
        fi

        pnpm i
        pnpm build

        if [ ! -d "./dist" ]; then
          echo "Build finished but ./dist was not produced — check the pnpm build output above."
          exit 1
        fi

        echo "Saving node_modules cache..."
        rm -rf "$NM_CACHE/node_modules"
        cp -a ./node_modules "$NM_CACHE/node_modules"

        echo "Build complete:"
        find ./dist -maxdepth 1
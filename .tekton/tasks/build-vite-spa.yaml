apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-vite-spa
  namespace: default
spec:
  steps:
    - name: build
      image: docker.io/gingersociety/vite-react-builder:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        cd /workspace/source/repo

        export PNPM_HOME=/workspace/general-purpose-cache/pnpm
        mkdir -p "$PNPM_HOME"
        pnpm config set store-dir "$PNPM_HOME"

        # ── keep node_modules on the same PVC as the pnpm store ────────────
        # Symlinking (instead of copying in/out) means pnpm writes directly
        # to persistent storage, and — since node_modules and the store are
        # now on the same filesystem — pnpm can hardlink packages out of the
        # store instead of copying file contents, which is the slow part.
        REPO_KEY=$(basename "$(git rev-parse --show-toplevel)")
        NM_CACHE="/workspace/general-purpose-cache/node_modules-cache/${REPO_KEY}"
        mkdir -p "$NM_CACHE"

        rm -rf ./node_modules
        ln -s "$NM_CACHE" ./node_modules

        pnpm i
        pnpm build

        if [ ! -d "./dist" ]; then
          echo "Build finished but ./dist was not produced — check the pnpm build output above."
          exit 1
        fi

        echo "Build complete:"
        find ./dist -maxdepth 1
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-amd64-windows
  namespace: default
spec:
  params:
    - name: binaries_to_build
      type: string
      default: ""
  steps:
    - name: build
      image: gingersociety/multi-arch-rust-cli-builder:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e
        echo "Building for amd64 windows..."
        export PATH="/root/.cargo/bin:$PATH"
        /usr/local/bin/mount-ginger-credentials.sh

        mkdir -p /workspace/general-purpose-cache/target
        mkdir -p /workspace/general-purpose-cache/cargo

        cd /workspace/source/repo

        ginger-connector connect prod

        export CARGO_HOME=/workspace/general-purpose-cache/cargo-windows
        export CARGO_TARGET_DIR=/workspace/general-purpose-cache/target-windows

        mkdir -p /workspace/general-purpose-cache/target-windows
        mkdir -p /workspace/general-purpose-cache/cargo-windows

        TARGET="x86_64-pc-windows-gnu"

        # ── derive name + version dynamically from Cargo.toml ──────────────
        package_section=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f' Cargo.toml)

        version=$(echo "$package_section" | grep '^version' | awk -F '"' '{print $2}')
        default_run=$(echo "$package_section" | grep '^default-run' | awk -F '"' '{print $2}')

        if [ -n "$default_run" ]; then
          executable_name="$default_run"
        else
          executable_name=$(echo "$package_section" | grep '^name' | awk -F '"' '{print $2}')
        fi

        if [ -z "$executable_name" ]; then
          echo "Could not determine executable name from Cargo.toml"
          exit 1
        fi
        if [ -z "$version" ]; then
          echo "Could not determine version from Cargo.toml"
          exit 1
        fi
        echo "Building executable: $executable_name (version $version)"

        # ── which [[bin]] targets to build ──────────────────────────────────
        BINARIES_TO_BUILD="$(params.binaries_to_build)"
        IFS=',' read -ra BINARIES <<< "$BINARIES_TO_BUILD"
        if [ ${#BINARIES[@]} -eq 0 ] || [ -z "${BINARIES[0]}" ]; then
          BINARIES=("$executable_name")
        fi
        echo "Binaries to build: ${BINARIES[*]}"

        bin_flags=()
        for b in "${BINARIES[@]}"; do
          bin_flags+=(--bin "$b")
        done

        out_dir="./bin/${TARGET}"

        if [ -d "$out_dir" ]; then
          echo "Deleting existing $out_dir directory..."
          rm -rf "$out_dir"
        fi
        mkdir -p "$out_dir"

        echo "Building for $TARGET..."
        cargo build --release --target "$TARGET" "${bin_flags[@]}"

        for b in "${BINARIES[@]}"; do
          cp "$CARGO_TARGET_DIR/$TARGET/release/${b}.exe" "$out_dir/"
        done

        echo "Build complete:"
        find "$out_dir" -type f

        for b in "${BINARIES[@]}"; do
          echo "Uploading ${b} (${TARGET}) build..."
          ginger-infra upload "${executable_name}-binaries/${version}/${TARGET}/${b}.exe" "${out_dir}/${b}.exe" --overwrite
        done
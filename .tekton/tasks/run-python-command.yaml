apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-python-command
  namespace: default
spec:
  params:
    - name: command
      type: string
      default: "python setup.py build"
  steps:
    - name: run
      image: docker.gingersociety.org/ginger-society/py-lib-base:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        cd /workspace/source/repo

        echo "Running: $(params.command)"
        $(params.command)
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: install-npm-packages
  namespace: default
spec:
  steps:
    - name: install
      image: docker.gingersociety.org/ginger-society/vite-react-builder:latest
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        export HUSKY=0
        export CI=true

        # ── restore npm credentials staged by ginger-connector-setup ───────
        # That step runs `ginger-auth token-login` in its own container and
        # copies the resulting ~/.npmrc into the shared creds workspace,
        # since this step's $HOME starts empty.
        if [ ! -f "$(workspaces.creds.path)/.npmrc" ]; then
          echo "No .npmrc found in creds workspace — did ginger-auth run first?"
          exit 1
        fi
        cp "$(workspaces.creds.path)/.npmrc" "$HOME/.npmrc"
        chmod 600 "$HOME/.npmrc"

        cd "$(workspaces.source.path)/repo"

        export PNPM_HOME="$(workspaces.general-purpose-cache.path)/pnpm"
        mkdir -p "$PNPM_HOME"
        pnpm config set store-dir "$PNPM_HOME"

        echo "Installing dependencies..."
        pnpm i --reporter=append-only
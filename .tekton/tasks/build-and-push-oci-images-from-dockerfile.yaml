apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-and-push-dockerfile-image
  namespace: default
spec:
  params:
    - name: image_repo
      type: string
    - name: image_tag
      type: string
      default: "latest"
    - name: dockerfile_path
      type: string
    - name: build_context
      type: string
      default: "."
    - name: build_args
      type: array
      default: []
    - name: org_id
      type: string
    - name: registry
      type: string
      default: "docker.gingersociety.org"
  steps:
    - name: build-and-push
      image: gingersociety/tekton-task-buildah:latest
      imagePullPolicy: Always
      args:
        - "$(params.build_args[*])"
      script: |
        #!/bin/bash
        set -e

        export XDG_RUNTIME_DIR=/workspace/buildah-cache/runtime
        export CONTAINERS_STORAGE=/workspace/buildah-cache/storage
        export CONTAINERS_STORAGE_CONF=/workspace/buildah-cache/storage.conf

        /usr/local/bin/configure_buildah.sh
        /usr/local/bin/mount-docker-credentials.sh

        cd /workspace/source/repo

        IMAGE_REPO="$(params.registry)/$(params.org_id)/$(params.image_repo)"
        FINAL_IMAGE="${IMAGE_REPO}:$(params.image_tag)"

        BUILD_ARGS_FLAGS=""
        for arg in "$@"; do
          BUILD_ARGS_FLAGS="$BUILD_ARGS_FLAGS --build-arg $arg"
        done

        buildah bud \
          --storage-driver=vfs \
          --root=$CONTAINERS_STORAGE \
          -f "$(params.dockerfile_path)" \
          -t "$FINAL_IMAGE" \
          $BUILD_ARGS_FLAGS \
          "$(params.build_context)"

        buildah push \
          --storage-driver=vfs \
          --root=$CONTAINERS_STORAGE \
          --authfile ~/.docker/config.json \
          "$FINAL_IMAGE"

        echo "Image pushed successfully: $FINAL_IMAGE"
      securityContext:
        privileged: true
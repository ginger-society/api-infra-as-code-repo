apiVersion: gingersociety.org/v1alpha1
kind: RemoteTask
metadata:
  name: docker-arm64-linux-build
  namespace: default
spec:
  capability: "aarch64-apple-darwin"
  script: |
    #!/bin/bash
    echo "Starting remote task for aarch64-apple-darwin..."
    set -e
    source /etc/ginger-society/hooks/rpc_creds.sh

    echo "HOME     : $HOME"
    echo "USER     : $USER"
    echo "GIT_REPO_NAME: $GIT_REPO_NAME"
    echo "IMAGE_TAG: $IMAGE_TAG"
    echo "BINARIES_TO_BUILD: $BINARIES_TO_BUILD"
    echo "BINARIES_TO_UPLOAD: $BINARIES_TO_UPLOAD"
    cd "$HOME"
    ls -la
    pwd
    REPO_URL="git@source.gingersociety.org:${GIT_REPO_NAME}.git"
    CLONE_DIR="${GIT_REPO_NAME}"

    echo "Cloning ${REPO_URL} into ${CLONE_DIR}..."
    git clone "$REPO_URL" "$CLONE_DIR"

    cd "$CLONE_DIR"
    echo "Cloned repo, current commit:"
    git log -1 --oneline

    # ── persistent build cache, keyed by repo ───────────────────────────────
    # $HOME is per-job (wiped each RPC_JOB_ID), but $CACHE_HOME persists across
    # runs on this runner — bind-mount it into the container so Cargo's
    # target dir survives across jobs instead of rebuilding from scratch.
    #
    # NOTE: these caches are safe to bind-mount because cargo only ever ADDS
    # new files here (new crate versions, new target artifacts) — it never
    # needs to modify a file that already existed on the host side of the
    # mount before the container attached to it. That's the distinction that
    # matters: Docker Desktop's macOS file-sharing layer has been observed to
    # reliably allow a container to create new files through a bind mount,
    # but to intermittently/consistently refuse writes that modify a
    # pre-existing host file through that same mount (this is what broke
    # Cargo.lock updates — see the workspace copy step below for the fix).
    export CARGO_TARGET_DIR_HOST="${CACHE_HOME}/${GIT_REPO_NAME}/target-linux-arm64"
    mkdir -p "$CARGO_TARGET_DIR_HOST"
    echo "CARGO_TARGET_DIR_HOST: $CARGO_TARGET_DIR_HOST"

    # ── persistent cargo registry cache, shared across ALL repos/jobs ──────
    # CARGO_HOME holds the crates.io index + downloaded crate sources —
    # these are the same regardless of which repo is building, so this is
    # kept global (not per-repo) to maximize reuse and avoid re-downloading
    # the same dependency versions on every job.
    export CARGO_HOME_HOST="${CACHE_HOME}/cargo-home"
    mkdir -p "$CARGO_HOME_HOST"
    echo "CARGO_HOME_HOST: $CARGO_HOME_HOST"

    ginger-connector connect prod

    if [ -d "bin" ]; then
      echo "Deleting existing bin directory..."
      rm -rf bin
    fi

    # ── derive name + version dynamically from Cargo.toml ──────────────
    # Scope to the [package] section only, so a multi-bin crate's [[bin]]
    # "name" entries don't get picked up by mistake. Prefer default-run
    # (the "main" binary for the package) and fall back to the package
    # name when default-run isn't set.
    package_section=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f' Cargo.toml)

    version=$(echo "$package_section" | grep '^version' | awk -F '"' '{print $2}')
    default_run=$(echo "$package_section" | grep '^default-run' | awk -F '"' '{print $2}')

    if [ -n "$default_run" ]; then
      executable_name="$default_run"
    else
      executable_name=$(echo "$package_section" | grep '^name' | awk -F '"' '{print $2}')
    fi

    if [ -z "$executable_name" ]; then
      echo "Could not determine executable name from Cargo.toml"
      exit 1
    fi
    if [ -z "$version" ]; then
      echo "Could not determine version from Cargo.toml"
      exit 1
    fi
    echo "Building executable: $executable_name (version $version)"

    # ── which [[bin]] targets to build ──────────────────────────────────
    # BINARIES_TO_BUILD is a CSV of bin names from Cargo.toml's [[bin]]
    # entries (e.g. "remote-task-controller,restic-snapshot-controller").
    # If unset/empty, fall back to just the main bin (default-run/name).
    IFS=',' read -ra BINARIES <<< "${BINARIES_TO_BUILD:-}"
    if [ ${#BINARIES[@]} -eq 0 ] || [ -z "${BINARIES[0]}" ]; then
      BINARIES=("$executable_name")
    fi
    echo "Binaries to build: ${BINARIES[*]}"

    bin_flags=""
    for b in "${BINARIES[@]}"; do
      bin_flags="${bin_flags} --bin ${b}"
    done

    # ── which built binaries to actually upload ──────────────────────────
    # BINARIES_TO_UPLOAD is a CSV of bin names. If unset/empty, defaults to
    # everything in BINARIES_TO_BUILD. Anything listed here that wasn't
    # actually built (i.e. not in BINARIES) is silently dropped, so this
    # can never upload a binary that wasn't built.
    IFS=',' read -ra UPLOAD_BINARIES <<< "${BINARIES_TO_UPLOAD:-}"
    if [ ${#UPLOAD_BINARIES[@]} -eq 0 ] || [ -z "${UPLOAD_BINARIES[0]}" ]; then
      UPLOAD_BINARIES=("${BINARIES[@]}")
    fi

    FILTERED_UPLOAD_BINARIES=()
    for u in "${UPLOAD_BINARIES[@]}"; do
      for b in "${BINARIES[@]}"; do
        if [ "$u" == "$b" ]; then
          FILTERED_UPLOAD_BINARIES+=("$u")
          break
        fi
      done
    done
    UPLOAD_BINARIES=("${FILTERED_UPLOAD_BINARIES[@]}")
    echo "Binaries to upload: ${UPLOAD_BINARIES[*]}"

    # ── aarch64-unknown-linux-gnu via docker (native arm64 on this runner) ──
    #
    # The repo is COPIED into the container's own filesystem (docker cp),
    # not bind-mounted. This is deliberate: Docker Desktop's macOS
    # file-sharing layer will happily let a container CREATE new files
    # through a bind mount, but will refuse/corrupt writes that MODIFY a
    # file that already existed on the host before the mount was attached —
    # which is exactly what cargo needs to do to Cargo.lock whenever the
    # dependency graph changes (e.g. after the codegen step above adds a new
    # generated local client crate). Copying the repo in means every file
    # cargo might rewrite was created fresh inside the container's own
    # storage, so that failure mode can't happen. The two cache dirs below
    # stay bind-mounted since cargo only ever adds new files to them.
    #
    # docker create + docker cp + docker start (rather than docker run) is
    # what makes the copy-in / copy-out possible: `create` sets up the
    # container without starting it, `cp` populates /workspace from the
    # host repo, then `start -a` runs the actual build and streams output.
    target="aarch64-unknown-linux-gnu"
    echo "Building for $target..."

    CONTAINER_NAME="build-${GIT_REPO_NAME}-${RPC_JOB_ID}"

    cleanup_build_container() {
      docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
    }
    trap cleanup_build_container EXIT

    echo "Creating build container..."
    docker create --name "$CONTAINER_NAME" \
      --platform linux/arm64 \
      -v "${CARGO_TARGET_DIR_HOST}:/cargo-target" \
      -v "${CARGO_HOME_HOST}:/cargo-home" \
      -e "CARGO_TARGET_DIR=/cargo-target" \
      -e "CARGO_HOME=/cargo-home" \
      -w /workspace \
      gingersociety/rust-cli-builder \
      bash -c "cargo build --release --target ${target}${bin_flags} && mkdir -p ./bin/${target} && for b in ${BINARIES[*]}; do cp /cargo-target/${target}/release/\$b ./bin/${target}/; done" \
      > /dev/null

    echo "Copying repo into build container..."
    docker cp ./. "${CONTAINER_NAME}:/workspace"

    echo "Running build..."
    if ! docker start -a "$CONTAINER_NAME"; then
      echo "Build failed inside container"
      exit 1
    fi

    echo "Copying build output back..."
    rm -rf bin
    docker cp "${CONTAINER_NAME}:/workspace/bin" ./bin

    echo "Build complete:"
    find bin -type f

    for b in "${UPLOAD_BINARIES[@]}"; do
      echo "Uploading ${b} (${target}) build..."
      ginger-infra upload "${executable_name}-binaries/${version}/${target}" "bin/${target}/${b}" --overwrite
    done
  cleanup: |
    #!/bin/bash
    echo "cleanup: nothing to do"
  env: []
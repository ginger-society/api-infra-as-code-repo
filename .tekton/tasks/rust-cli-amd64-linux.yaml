apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-amd64-linux
  namespace: default
spec:
  params:
    - name: binaries_to_build
      type: string
      default: ""
    - name: openssl_static
      type: string
      default: ""
    - name: openssl_dir
      type: string
      default: ""
    - name: target
      type: string
      default: "x86_64-unknown-linux-gnu"
  steps:
    - name: build
      image: docker.gingersociety.org/ginger-society/multi-arch-rust:latest-amd64
      imagePullPolicy: Always
      script: |
        #!/bin/bash
        set -e

        if [ -n "$(params.openssl_dir)" ]; then
          export OPENSSL_DIR="$(params.openssl_dir)"
        fi
        if [ -n "$(params.openssl_static)" ]; then
          export OPENSSL_STATIC="$(params.openssl_static)"
        fi

        TARGET="$(params.target)"
        echo "Building for $TARGET..."
        export PATH="/root/.cargo/bin:$PATH"

        cd /workspace/source/repo

        # Shared across targets — cargo's package-cache lock makes this safe
        export CARGO_HOME=/workspace/general-purpose-cache/cargo

        # Must be per-target so parallel gnu/musl/arm64 builds don't collide
        export CARGO_TARGET_DIR="/workspace/general-purpose-cache/target-${TARGET}"

        mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"

        # ── derive name + version dynamically from Cargo.toml ──────────────
        package_section=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f' Cargo.toml)

        version=$(echo "$package_section" | grep '^version' | awk -F '"' '{print $2}')
        default_run=$(echo "$package_section" | grep '^default-run' | awk -F '"' '{print $2}')

        if [ -n "$default_run" ]; then
          executable_name="$default_run"
        else
          executable_name=$(echo "$package_section" | grep '^name' | awk -F '"' '{print $2}')
        fi

        if [ -z "$executable_name" ]; then
          echo "Could not determine executable name from Cargo.toml"
          exit 1
        fi
        if [ -z "$version" ]; then
          echo "Could not determine version from Cargo.toml"
          exit 1
        fi
        echo "Building executable: $executable_name (version $version)"

        # ── which [[bin]] targets to build ──────────────────────────────────
        BINARIES_TO_BUILD="$(params.binaries_to_build)"
        IFS=',' read -ra BINARIES <<< "$BINARIES_TO_BUILD"
        if [ ${#BINARIES[@]} -eq 0 ] || [ -z "${BINARIES[0]}" ]; then
          BINARIES=("$executable_name")
        fi
        echo "Binaries to build: ${BINARIES[*]}"

        bin_flags=()
        for b in "${BINARIES[@]}"; do
          bin_flags+=(--bin "$b")
        done

        out_dir="./bin/${TARGET}"

        if [ -d "$out_dir" ]; then
          echo "Deleting existing $out_dir directory..."
          rm -rf "$out_dir"
        fi
        mkdir -p "$out_dir"

        cargo build --release --target "$TARGET" "${bin_flags[@]}"

        for b in "${BINARIES[@]}"; do
          cp "$CARGO_TARGET_DIR/$TARGET/release/$b" "$out_dir/"
        done

        echo "Build complete:"
        find "$out_dir" -type f
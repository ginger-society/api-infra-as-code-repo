<VirtualHost *:80>
    ServerName gingersociety.org
    ServerAlias www.gingersociety.org
    ErrorLog ${APACHE_LOG_DIR}/gingersociety/error.log
    CustomLog ${APACHE_LOG_DIR}/gingersociety/access.log combined

    RewriteEngine on

    # www -> non-www (and http -> https at the same time)
    RewriteCond %{HTTP_HOST} ^www\.gingersociety\.org$ [NC]
    RewriteRule ^ https://gingersociety.org%{REQUEST_URI} [END,NE,R=permanent]

    # non-www http -> https (your original rule, still needed for plain http:// requests)
    RewriteCond %{SERVER_NAME} =gingersociety.org
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>



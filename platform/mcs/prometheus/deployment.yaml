apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

        # ── Sidecar: auth proxy ───────────────────────────────────────────────
        # Listens on :3000, validates JWTs, and forwards authed traffic
        # to Prometheus on localhost:9090.
        - name: ginger-auth-proxy
          image: docker.gingersociety.org/ginger-society/auth-proxy:latest
          ports:
            - containerPort: 3000
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: UPSTREAM_URL
              value: "http://localhost:9090"
            - name: IAM_LOGIN_URL
              value: "https://iam.gingersociety.org/#prometheus/login"   # ← replace with your IAM URL
            - name: PORT
              value: "3000"
            # Uncomment to bypass auth on specific paths, e.g. for
            # unauthenticated scraping by other in-cluster Prometheus/Grafana
            # instances, or health checks.
            # - name: EXCLUDED_PATHS
            #   value: "/-/healthy,/-/ready"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector:
    app: prometheus
  ports:
    - name: proxy
      protocol: TCP
      port: 80
      targetPort: 3000   # ← traffic enters through the auth proxy, not Prometheus directly
  type: ClusterIP
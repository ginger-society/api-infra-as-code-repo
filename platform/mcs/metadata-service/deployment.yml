apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadataservice
  labels:
    app: metadataservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadataservice
  template:
    metadata:
      annotations:
        x-ginger-code-ejectable: "metadataservice"
      labels:
        app: metadataservice
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:latest
          command:
            - sh
            - -c
            - |
              until pg_isready -h metadata-postgresql -p 5432 -U postgres; do 
                echo "Waiting for DB..."
                sleep 5
              done

      containers:
        - name: metadataservice
          image: docker.gingersociety.org/ginger-society/metadata-service:latest
          ports:
            - containerPort: 8000

          env:
            # ✅ DATABASE_URL from secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metadata-service-api-secrets
                  key: DATABASE_URL

            # ✅ Redis (unchanged)
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: estonia-redis-auth
                  key: url

            # ✅ App secrets from same secret
            - name: ISC_SECRET
              valueFrom:
                secretKeyRef:
                  name: metadata-service-api-secrets
                  key: ISC_SECRET

            - name: ROCKET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: metadata-service-api-secrets
                  key: ROCKET_SECRET_KEY

            # ✅ Global secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET

            # ✅ Static config
            - name: ROCKET_ADDRESS
              value: "0.0.0.0"

            - name: ROCKET_PORT
              value: "8000"
apiVersion: v1
kind: Service
metadata:
  name: prometheus-internal
spec:
  selector:
    app: prometheus
  ports:
    - name: prom
      protocol: TCP
      port: 9090
      targetPort: 9090   # ← hits Prometheus directly, skipping the auth proxy
  type: ClusterIP
---
# Locks prometheus-internal down to only Grafana's pods. Everything else
# (including the public/auth-proxied prometheus-service) is unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-internal-access
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    # Allow the auth-proxy path (any pod) to keep working on port 3000.
    - ports:
        - protocol: TCP
          port: 3000
    # Allow only Grafana pods direct access to port 9090.
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
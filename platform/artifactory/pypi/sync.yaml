apiVersion: v1
kind: Secret
metadata:
  name: pypi-public-token
type: Opaque
stringData:
  token: "{{PIP.TOKEN}}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pypi-public-sync
spec:
  schedule: "0 * * * *"          # hourly — matches old SLEEP_SECONDS=3600
  concurrencyPolicy: Forbid       # don't overlap runs if one takes >1h
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0               # exactly one attempt; let the hourly schedule be the retry
      activeDeadlineSeconds: 1800   # kill a stuck run after 30m
      template:
        metadata:
          labels:
            app: pypi-public-sync
        spec:
          restartPolicy: Never
          # Must land on the same node as the pypi-pvc volume (RWO + node-pinned).
          nodeSelector:
            kubernetes.io/hostname: artifactory-control-plane
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
          containers:
            - name: sync
              image: gingersociety/public-registry-publisher:latest
              args: ["push-py"]
              env:
                - name: SYNC_PACKAGES
                  value: "ginger_dj_framework"
                - name: PACKAGES_DIR
                  value: "/data/packages"
                - name: REPOSITORY_URL
                  value: "https://upload.pypi.org/legacy/"
                - name: DRY_RUN
                  value: "false"
                - name: TWINE_USERNAME
                  value: "__token__"
                - name: TWINE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pypi-public-token
                      key: token
              volumeMounts:
                - mountPath: /data/packages
                  name: pypi-storage
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: pypi-storage
              persistentVolumeClaim:
                claimName: pypi-pvc
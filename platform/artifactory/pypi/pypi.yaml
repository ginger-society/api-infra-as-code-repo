
apiVersion: v1
kind: Secret
metadata:
  name: pip-index-service-api-secrets
type: Opaque
stringData:
  ROCKET_SECRET_KEY: {{shared.ROCKET_SECRET_KEY}}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    snapshot.gingersociety.org/enabled: "true"
    volume.kubernetes.io/selected-node: "artifactory-control-plane"
  name: pypi-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pypiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pypiserver
  template:
    metadata:
      labels:
        app: pypiserver
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        # ── pip-index: now handles its own auth internally (BasicAuth for
        # protocol routes, session-cookie + IAM redirect for /details), so
        # the ginger-auth-proxy sidecar is no longer needed. ──────────────
        - name: pip-index
          image: gingersociety/pip-index:latest
          imagePullPolicy: Always
          env:
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: hampi-redis-auth
                  key: url
            - name: PACKAGES_DIR
              value: "/data/packages"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: IAM_LOGIN_URL
              value: "https://iam.{{HOSTING_FQDN}}/#pypi-index/login"
            - name: PUBLIC_BASE_URL
              value: "https://pip.{{HOSTING_FQDN}}/"
            - name: RUST_LOG
              value: "debug"

            - name: ROCKET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pip-index-service-api-secrets
                  key: ROCKET_SECRET_KEY
            - name: ROCKET_ADDRESS
              value: "0.0.0.0"

            - name: ROCKET_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /data/packages
              name: pypi-storage
      volumes:
        - name: pypi-storage
          persistentVolumeClaim:
            claimName: pypi-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pypiserver
spec:
  selector:
    app: pypiserver
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
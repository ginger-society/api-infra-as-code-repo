apiVersion: v1
kind: Secret
metadata:
  name: container-registry-service-api-secrets
type: Opaque
stringData:
  ROCKET_SECRET_KEY: {{shared.ROCKET_SECRET_KEY}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-ui
  template:
    metadata:
      annotations:
        x-ginger-code-ejectable: "registry-ui"
      labels:
        app: registry-ui
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        # ── registry-ui: now handles its own session auth (JWT cookie
        # check + IAM redirect + handle-auth callback) internally, so the
        # ginger-auth-proxy sidecar is no longer needed for this service. ──
        - name: registry-ui
          image: gingersociety/container-registry-ui:latest
          imagePullPolicy: Always
          env:
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: hampi-redis-auth
                  key: url
            - name: REGISTRY_HOST
              value: "docker.gingersociety.org"
            - name: REGISTRY_SSL
              value: "true"
            - name: AUTH_SERVER
              value: "https://api.{{HOSTING_FQDN}}/iam/docker-token"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
            - name: IAM_LOGIN_URL
              value: "https://iam.{{HOSTING_FQDN}}/#docker-registry/login"   # ← replace with your IAM URL
            - name: RUST_LOG
              value: "debug"

            - name: ROCKET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: container-registry-service-api-secrets
                  key: ROCKET_SECRET_KEY
            - name: ROCKET_ADDRESS
              value: "0.0.0.0"

            - name: ROCKET_PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
spec:
  selector:
    app: registry-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
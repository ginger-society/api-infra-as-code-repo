# =============================================================
# tekton-cleanup-cronjob.yaml
#
# Nightly cleanup of PipelineRuns (and their pods/PVCs) older
# than 24h, across ALL namespaces in the cluster. Runs at 03:15
# every day. Metadata/logs are assumed to already be archived
# elsewhere (Postgres/Loki per teardown.sh's design) — this only
# deletes live cluster objects.
#
# Apply with:
#   kubectl apply -f tekton-cleanup-cronjob.yaml
#
# Test it on demand without waiting for the schedule:
#   kubectl create job --from=cronjob/tekton-pipelinerun-cleanup \
#     tekton-pipelinerun-cleanup-manual -n kube-system
# =============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-cleanup
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-cleanup
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-cleanup
subjects:
  - kind: ServiceAccount
    name: tekton-cleanup
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: tekton-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tekton-cleanup-script
  namespace: kube-system
data:
  teardown-old-runs.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    MAX_AGE_HOURS="${MAX_AGE_HOURS:-24}"
    # Comma-separated list of namespaces to skip entirely, e.g. "kube-system,cert-manager"
    EXCLUDE_NAMESPACES="${EXCLUDE_NAMESPACES:-}"
    DRY_RUN="${DRY_RUN:-false}"

    echo ""
    echo "  Sweeping PipelineRuns in ALL namespaces older than ${MAX_AGE_HOURS}h"
    [[ -n "$EXCLUDE_NAMESPACES" ]] && echo "  Excluding namespaces: ${EXCLUDE_NAMESPACES}"
    [[ "$DRY_RUN" == "true" ]] && echo "  (dry-run — nothing will actually be deleted)"
    echo ""

    NOW_EPOCH=$(date -u +%s)
    CUTOFF_EPOCH=$((NOW_EPOCH - MAX_AGE_HOURS * 3600))

    # Build a jq-friendly exclude array, e.g. ["kube-system","cert-manager"]
    EXCLUDE_JSON=$(printf '%s\n' "$EXCLUDE_NAMESPACES" \
      | jq -R -c 'split(",") | map(select(length > 0))')

    RUNS_JSON=$(kubectl get pipelinerun --all-namespaces -o json 2>/dev/null || echo '{"items":[]}')
    RUN_COUNT=$(echo "$RUNS_JSON" | jq --argjson excl "$EXCLUDE_JSON" '
      [.items[] | select(.metadata.namespace as $ns | $excl | index($ns) | not)] | length
    ')

    if [[ "$RUN_COUNT" -eq 0 ]]; then
      echo "  No PipelineRuns found (after exclusions)."
      exit 0
    fi

    DELETED=0
    SKIPPED=0
    FAILED=0

    while IFS=$'\t' read -r ns run_name ref_epoch; do
      [[ -z "$run_name" ]] && continue

      if [[ -z "$ref_epoch" || "$ref_epoch" == "null" ]]; then
        echo "  — ${ns}/${run_name}: could not parse timestamp, skipping"
        SKIPPED=$((SKIPPED + 1))
        continue
      fi

      if [[ "$ref_epoch" -gt "$CUTOFF_EPOCH" ]]; then
        SKIPPED=$((SKIPPED + 1))
        continue
      fi

      age_hours=$(( (NOW_EPOCH - ref_epoch) / 3600 ))
      echo "  → ${ns}/${run_name} (age: ${age_hours}h) — tearing down"

      if [[ "$DRY_RUN" == "true" ]]; then
        echo "      [dry-run] would delete pipelinerun/pods/pvcs for ${ns}/${run_name}"
        continue
      fi

      if kubectl get pipelinerun "$run_name" -n "$ns" &>/dev/null; then
        if kubectl delete pipelinerun "$run_name" -n "$ns" --ignore-not-found; then
          echo "      ✓ deleted PipelineRun/${run_name} in ${ns}"
        else
          echo "      ✗ failed to delete PipelineRun/${run_name} in ${ns}"
          FAILED=$((FAILED + 1))
          continue
        fi
      fi

      if kubectl get pods -n "$ns" -l "tekton.dev/pipelineRun=${run_name}" \
          --no-headers 2>/dev/null | grep -q .; then
        kubectl delete pods -n "$ns" \
          -l "tekton.dev/pipelineRun=${run_name}" --ignore-not-found
        echo "      ✓ deleted pods for ${ns}/${run_name}"
      fi

      if kubectl get pvc -n "$ns" -l "tekton.dev/pipelineRun=${run_name}" \
          --no-headers 2>/dev/null | grep -q .; then
        kubectl delete pvc -n "$ns" \
          -l "tekton.dev/pipelineRun=${run_name}" --ignore-not-found
        echo "      ✓ deleted PVCs for ${ns}/${run_name}"
      fi

      DELETED=$((DELETED + 1))
    done < <(echo "$RUNS_JSON" | jq -r --argjson excl "$EXCLUDE_JSON" '
      .items[] |
      select(.metadata.namespace as $ns | $excl | index($ns) | not) |
      [
        .metadata.namespace,
        .metadata.name,
        (
          (.status.completionTime // .metadata.creationTimestamp // "") as $t |
          if $t == "" then ""
          else
            try ($t | fromdateiso8601 | tostring)
            catch ""
          end
        )
      ] | @tsv
    ')

    echo ""
    echo "  Sweep complete: ${DELETED} deleted, ${SKIPPED} skipped (too recent), ${FAILED} failed"
    echo ""

    [[ "$FAILED" -eq 0 ]]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-pipelinerun-cleanup
  namespace: kube-system
spec:
  # 03:15 every day — adjust to taste. Cluster-local time of the
  # kube-controller-manager, which is normally UTC.
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: tekton-cleanup
          restartPolicy: Never
          containers:
            - name: cleanup
              image: alpine/k8s:1.30.12
              command: ["/bin/bash", "/scripts/teardown-old-runs.sh"]
              env:
                - name: MAX_AGE_HOURS
                  value: "24"
                - name: EXCLUDE_NAMESPACES
                  value: ""
                - name: DRY_RUN
                  value: "false"
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: tekton-cleanup-script
                defaultMode: 0755